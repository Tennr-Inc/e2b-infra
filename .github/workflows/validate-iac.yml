name: Validate IaC

on:
  workflow_call:
    inputs:
      run-validation:
        type: boolean
        description: "Whether to run OpenTofu validation"
        required: false
        default: true

permissions:
  contents: read

jobs:
  run-terraform-validation:
    name: Run OpenTofu validation
    if: ${{ inputs.run-validation == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        provider:
          - aws
          - gcp
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse .tool-versions
        uses: wistia/parse-tool-versions@v2.1.1

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: "1.11.6"

      - name: Check OpenTofu formatting
        run: tofu fmt -check -recursive

      - name: Validate OpenTofu
        working-directory: ./iac/provider-${{ matrix.provider }}
        run: |
          tofu init -backend=false
          tofu validate

      - name: Test AWS private deployment invariants
        if: ${{ matrix.provider == 'aws' }}
        working-directory: ./iac/provider-aws
        run: tofu test

  validate_terraform:
    needs: run-terraform-validation
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate OpenTofu validation result
        run: |
          if [[ "${{ inputs.run-validation }}" != "true" ]]; then
            echo "OpenTofu validation skipped because IaC paths did not change"
            exit 0
          fi

          if [[ "${{ needs.run-terraform-validation.result }}" != "success" ]]; then
            echo "OpenTofu validation result: ${{ needs.run-terraform-validation.result }}"
            exit 1
          fi

          echo "OpenTofu validation succeeded"
